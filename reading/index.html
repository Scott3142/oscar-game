<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Oscar! 🌟</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(135deg, #fbcfe8 0%, #bae6fd 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">
    <div class="max-w-xl w-full bg-white/95 backdrop-blur rounded-3xl shadow-2xl p-6 sm:p-8 text-center border-4 border-yellow-300">
        
        <!-- Header (Only shown during gameplay) -->
        <div id="game-header" class="hidden justify-between items-center mb-2">
            <button onclick="goHome()" class="bg-yellow-100 hover:bg-yellow-200 text-yellow-800 font-bold px-3 py-1.5 rounded-xl text-xs sm:text-sm shadow transition flex items-center gap-1">
                🏠 <span id="txt-levels">Levels</span>
            </button>
            <span id="level-badge" class="bg-purple-100 text-purple-700 font-bold px-3 py-1 rounded-full text-sm">Level 1</span>
            <button onclick="toggleLang()" id="lang-toggle-btn" class="bg-purple-100 hover:bg-purple-200 text-purple-800 font-bold px-3 py-1 rounded-xl text-xs sm:text-sm shadow transition">
                CY / EN
            </button>
        </div>
        <p id="sub-title" class="text-gray-600 mb-6 text-base sm:text-lg">Read words to find Oscar hiding with the family!</p>

        <!-- Dynamic Game Container -->
        <div id="game-container">
            <!-- Rendered via JavaScript -->
        </div>
    </div>

    <script>
        // --- TRANSLATIONS DICTIONARY ---
        const T = {
            en: {
                chooseLevel: "Choose a level to start finding Oscar!",
                levelBadge: "Level",
                level1: "⭐ Level 1 (Easy)",
                level2: "🌟 Level 2 (Medium)",
                level3: "🚀 Level 3 (Super Star)",
                mainMenu: "🏠 Main Menu (Games Hub)",
                step1: "📖 Step 1: Read this word and click the matching picture!",
                step2: "🎴 Step 2: Pick a card to find Oscar!",
                clickMatch: "Click the matching picture:",
                tryAgain: "❌ Sound it out and try again!",
                turnCard: "Turn over a card to see who is hiding underneath!",
                notOscar: (name) => `That's ${name}! Not Oscar. Try another word!`,
                nextWord: "Next Word! 🚀",
                foundOscar: "🎉 YOU FOUND OSCAR! 🎉",
                youFoundHim: "You found him!",
                goToLevel: (lvl) => `Go to Level ${lvl}! 🚀`,
                playAgain: "Play Again (Level 1) 🚀",
                backLevels: "Back to Levels 🏠",
                subTitleHome: "Choose a level to start finding Oscar!",
                subTitleGame: "Read the word to unlock a card!"
            },
            cy: {
                chooseLevel: "Dewiswch lefel i ddechrau dod o hyd i Oscar!",
                levelBadge: "Lefel",
                level1: "⭐ Lefel 1 (Hawdd)",
                level2: "🌟 Lefel 2 (Canolig)",
                level3: "🚀 Lefel 3 (Super Star)",
                mainMenu: "🏠 Prif Ddewislen (Hwb Gemau)",
                step1: "📖 Cam 1: Darllenwch yr gair yma a chliciwch ar y llun!",
                step2: "🎴 Cam 2: Dewiswch gerdyn i ddod o hyd i Oscar!",
                clickMatch: "Cliciwch y llun sy'n cyfateb:",
                tryAgain: "❌ Rhowch gynnig arall ar ei sillafu!",
                turnCard: "Trochwch gerdyn dros oddi tanwydd i weld pwy sy'n cuddio!",
                notOscar: (name) => `Dyna ${name}! Nid Oscar ydy e. Rhowch gynnig ar air arall!`,
                nextWord: "Gair Nesaf! 🚀",
                foundOscar: "🎉 CHI WEDI DOD O HYD I OSCAR! 🎉",
                youFoundHim: "Fe wnaethoch chi ddod o hyd iddo!",
                goToLevel: (lvl) => `Mewn i Lefel ${lvl}! 🚀`,
                playAgain: "Chwarae Eto (Lefel 1) 🚀",
                backLevels: "Nôl i'r Lefelau 🏠",
                subTitleHome: "Dewiswch lefel i ddechrau dod o hyd i Oscar!",
                subTitleGame: "Darllenwch y gair i ddatgloi cerdyn!"
            }
        };

        // --- PHONICS WORD BANKS (ENGLISH & WELSH) ---
        const WORDS_EN_1 = [
            { word: 'CAT', icon: '🐱' }, { word: 'HAT', icon: '🎩' },
            { word: 'MAP', icon: '🗺️' }, { word: 'DOG', icon: '🐶' },
            { word: 'SUN', icon: '☀️' }, { word: 'CAR', icon: '🚗' },
            { word: 'PEN', icon: '🖊️' }, { word: 'CUP', icon: '☕' }
        ];
        const WORDS_EN_2 = [
            { word: 'SHIP', icon: '🚢' }, { word: 'FISH', icon: '🐠' },
            { word: 'FROG', icon: '🐸' }, { word: 'STAR', icon: '⭐' },
            { word: 'MOON', icon: '🌙' }, { word: 'BOOK', icon: '📖' },
            { word: 'TREE', icon: '🌳' }, { word: 'MILK', icon: '🥛' }
        ];
        const WORDS_EN_3 = [
            { word: 'SHOP', icon: '🛒' }, { word: 'JUMP', icon: '🦘' },
            { word: 'PLUM', icon: '🫐' }, { word: 'SLIDE', icon: '🛝' },
            { word: 'DRUM', icon: '🥁' }, { word: 'CRAB', icon: '🦀' },
            { word: 'SWIM', icon: '🏊‍♂️' }, { word: 'HAND', icon: '✋' }
        ];

        // Welsh Phonics / Simple Sight Words Level 1-3
        const WORDS_CY_1 = [
            { word: 'CATH', icon: '🐱' }, { word: 'CI', icon: '🐶' },
            { word: 'TE', icon: '🍵' }, { word: 'MAM', icon: '👩' },
            { word: 'DAD', icon: '👨' }, { word: 'CAR', icon: '🚗' },
            { word: 'MEL', icon: '🍯' }, { word: 'HET', icon: '🎩' }
        ];
        const WORDS_CY_2 = [
            { word: 'LLWY', icon: '🥄' }, { word: 'BARN', icon: '🏠' },
            { word: 'CIG', icon: '🥩' }, { word: 'LLYFR', icon: '📖' },
            { word: 'LLEW', icon: '🦁' }, { word: 'DRWS', icon: '🚪' },
            { word: 'CLOC', icon: '⏰' }, { word: 'SEREN', icon: '⭐' }
        ];
        const WORDS_CY_3 = [
            { word: 'BLODYN', icon: '🌸' }, { word: 'DRAIG', icon: '🐉' },
            { word: 'PISEN', icon: '🟢' }, { word: 'PYSGOD', icon: '🐟' },
            { word: 'BWRDD', icon: '🪵' }, { word: 'CWPWRDD', icon: '🚪' },
            { word: 'TEULU', icon: '👨‍👩‍👧‍👦' }, { word: 'NOFIO', icon: '🏊‍♂️' }
        ];

        const OTHER_IMAGES = [
            'images/janny.jpg', 'images/esme.jpg', 'images/nanna.jpg',
            'images/daddy.jpg', 'images/mummy.jpg', 'images/charley.jpg', 'images/gareth.jpg'
        ];
        const OSCAR_IMAGE = 'images/oscar.jpg';

        // Game State
        let gameState = {
            lang: localStorage.getItem('oscar_game_lang') || 'en',
            phase: 'home', // 'home', 'word', 'card', 'wrong_guess', 'won'
            level: 1,
            currentWord: null,
            wordOptions: [],
            totalCards: 8,
            winningCard: 0,
            cardImages: [],
            revealedCards: Array(8).fill(false),
            lastRevealedPerson: ''
        };

        function toggleLang() {
            gameState.lang = gameState.lang === 'en' ? 'cy' : 'en';
            localStorage.setItem('oscar_game_lang', gameState.lang);
            render();
        }

        function goHome() {
            gameState.phase = 'home';
            render();
        }

        function goToMainHub() {
            window.location.href = "../";
        }

        function initGame(level = 1) {
            gameState.level = level;
            gameState.phase = 'word';
            gameState.revealedCards = Array(8).fill(false);
            
            gameState.winningCard = Math.floor(Math.random() * gameState.totalCards);
            
            let shuffledFamily = [...OTHER_IMAGES].sort(() => Math.random() - 0.5);
            gameState.cardImages = [];
            let famIdx = 0;
            for (let i = 0; i < gameState.totalCards; i++) {
                if (i === gameState.winningCard) {
                    gameState.cardImages.push(OSCAR_IMAGE);
                } else {
                    gameState.cardImages.push(shuffledFamily[famIdx++]);
                }
            }

            getNewWordChallenge();
            render();
        }

        function getNewWordChallenge() {
            let pool = (gameState.lang === 'cy') ? WORDS_CY_1 : WORDS_EN_1;
            if (gameState.level === 2) pool = (gameState.lang === 'cy') ? WORDS_CY_2 : WORDS_EN_2;
            if (gameState.level === 3) pool = (gameState.lang === 'cy') ? WORDS_CY_3 : WORDS_EN_3;

            let correct = pool[Math.floor(Math.random() * pool.length)];
            let distractors = pool.filter(w => w.word !== correct.word)
                                  .sort(() => Math.random() - 0.5)
                                  .slice(0, 2);
            
            gameState.wordOptions = [...distractors, correct].sort(() => Math.random() - 0.5);
            gameState.currentWord = correct;
        }

        function submitAnswer(icon) {
            const t = T[gameState.lang];
            if (icon === gameState.currentWord.icon) {
                gameState.phase = 'card';
                render();
            } else {
                getNewWordChallenge();
                render();
                document.getElementById('feedback').innerText = t.tryAgain;
            }
        }

        function pickCard(index) {
            gameState.revealedCards[index] = true;
            let imagePath = gameState.cardImages[index];
            let nameParts = imagePath.split('/');
            let fileName = nameParts[nameParts.length - 1].split('.')[0];
            gameState.lastRevealedPerson = fileName.charAt(0).toUpperCase() + fileName.slice(1);

            if (index === gameState.winningCard) {
                gameState.phase = 'won';
            } else {
                gameState.phase = 'wrong_guess';
            }
            render();
        }

        function nextWordAfterMiss() {
            gameState.phase = 'word';
            getNewWordChallenge();
            render();
        }

        function render() {
            const t = T[gameState.lang];
            const header = document.getElementById('game-header');
            const subTitle = document.getElementById('sub-title');
            const container = document.getElementById('game-container');

            // --- HOME SCREEN ---
            if (gameState.phase === 'home') {
                header.classList.add('hidden');
                subTitle.innerText = t.chooseLevel;
                container.innerHTML = `
                    <div class="py-6 flex flex-col gap-4 max-w-xs mx-auto">
                        <div class="w-32 h-32 mx-auto rounded-full border-4 border-pink-400 shadow-lg overflow-hidden mb-2">
                            <img src="${OSCAR_IMAGE}" alt="Oscar" class="w-full h-full object-cover">
                        </div>
                        <button onclick="initGame(1)" class="bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold text-xl py-4 rounded-2xl shadow-lg hover:scale-105 transition transform">
                            ${t.level1}
                        </button>
                        <button onclick="initGame(2)" class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-bold text-xl py-4 rounded-2xl shadow-lg hover:scale-105 transition transform">
                            ${t.level2}
                        </button>
                        <button onclick="initGame(3)" class="bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold text-xl py-4 rounded-2xl shadow-lg hover:scale-105 transition transform">
                            ${t.level3}
                        </button>
                        
                        <!-- Toggle Lang on Home -->
                        <button onclick="toggleLang()" class="bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold text-sm py-2 rounded-xl shadow transition">
                            🌐 ${gameState.lang === 'en' ? 'Cymraeg (Welsh)' : 'English'}
                        </button>

                        <!-- Main Hub Button -->
                        <button onclick="goToMainHub()" class="mt-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-sm py-3 rounded-2xl shadow transition flex items-center justify-center gap-1">
                            ${t.mainMenu}
                        </button>
                    </div>
                `;
                return;
            }

            // --- GAME PLAY / WIN SCREENS ---
            header.classList.remove('hidden');
            document.getElementById('level-badge').innerText = `${t.levelBadge} ${gameState.level}`;
            document.getElementById('lang-toggle-btn').innerText = gameState.lang === 'en' ? 'CY' : 'EN';

            if (gameState.phase === 'won') {
                subTitle.innerText = t.youFoundHim;
                let nextLevelBtn = '';
                if (gameState.level === 1) {
                    nextLevelBtn = `<button onclick="initGame(2)" class="bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold text-xl sm:text-2xl px-8 py-4 rounded-full shadow-lg hover:scale-105 transition transform">${t.goToLevel(2)}</button>`;
                } else if (gameState.level === 2) {
                    nextLevelBtn = `<button onclick="initGame(3)" class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-bold text-xl sm:text-2xl px-8 py-4 rounded-full shadow-lg hover:scale-105 transition transform">${t.goToLevel(3)}</button>`;
                } else {
                    nextLevelBtn = `<button onclick="goHome()" class="bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold text-xl sm:text-2xl px-8 py-4 rounded-full shadow-lg hover:scale-105 transition transform">${t.backLevels}</button>`;
                }

                container.innerHTML = `
                    <div class="py-4">
                        <h2 class="text-3xl sm:text-5xl font-extrabold text-green-600 mb-4">${t.foundOscar}</h2>
                        <div class="w-48 h-48 sm:w-56 sm:h-56 mx-auto rounded-3xl border-8 border-pink-400 shadow-xl overflow-hidden mb-6">
                            <img src="${OSCAR_IMAGE}" alt="Oscar" class="w-full h-full object-cover">
                        </div>
                        ${nextLevelBtn}
                    </div>
                `;
                return;
            }

            let bannerText = gameState.phase === 'word' ? t.step1 : t.step2;
            let bannerClass = gameState.phase === 'word' ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800';

            let wordSectionClass = gameState.phase === 'word' ? 'block' : 'hidden';
            let cardSectionClass = gameState.phase === 'word' ? 'hidden' : 'block';

            let cardsHTML = '';
            for (let i = 0; i < gameState.totalCards; i++) {
                if (gameState.revealedCards[i]) {
                    cardsHTML += `
                        <div class="h-24 sm:h-28 rounded-2xl border-4 border-white shadow-lg overflow-hidden bg-white">
                            <img src="${gameState.cardImages[i]}" class="w-full h-full object-cover">
                        </div>
                    `;
                } else {
                    cardsHTML += `
                        <button onclick="pickCard(${i})" class="h-24 sm:h-28 w-full bg-gradient-to-br from-indigo-500 to-purple-600 text-white font-bold text-3xl rounded-2xl border-4 border-white shadow-lg hover:scale-105 transition transform flex items-center justify-center">
                            ?
                        </button>
                    `;
                }
            }

            let optionsHTML = gameState.wordOptions.map(opt => `
                <button onclick="submitAnswer('${opt.icon}')" class="bg-white border-4 border-pink-300 hover:border-pink-500 rounded-2xl p-4 sm:p-6 text-4xl sm:text-5xl shadow-md hover:scale-105 transition transform flex items-center justify-center">
                    ${opt.icon}
                </button>
            `).join('');

            let feedbackBoxHTML = '';
            if (gameState.phase === 'wrong_guess') {
                feedbackBoxHTML = `
                    <div class="flex flex-col items-center mt-4">
                        <p class="text-purple-700 font-bold text-base sm:text-lg mb-2">${t.notOscar(gameState.lastRevealedPerson)}</p>
                        <button onclick="nextWordAfterMiss()" class="bg-purple-600 text-white px-6 py-2 rounded-full font-bold shadow hover:bg-purple-700 transition">
                            ${t.nextWord}
                        </button>
                    </div>
                `;
            } else {
                feedbackBoxHTML = `<p class="text-gray-500 text-sm mt-4">${t.turnCard}</p>`;
            }

            subTitle.innerText = `${t.levelBadge} ${gameState.level} - ${t.subTitleGame}`;

            container.innerHTML = `
                <div id="phase-banner" class="mb-6 p-3 sm:p-4 rounded-2xl ${bannerClass} font-bold text-lg sm:text-xl">
                    ${bannerText}
                </div>

                <!-- Word Challenge Section -->
                <div id="word-section" class="mb-8 ${wordSectionClass}">
                    <div class="bg-yellow-100 border-4 border-dashed border-yellow-400 rounded-3xl p-6 sm:p-8 mb-6 inline-block">
                        <span id="target-word" class="text-5xl sm:text-6xl font-extrabold tracking-wider text-purple-700">${gameState.currentWord ? gameState.currentWord.word : ''}</span>
                    </div>
                    <p class="text-gray-600 mb-4 font-medium">${t.clickMatch}</p>
                    <div id="options-grid" class="grid grid-cols-3 gap-3 sm:gap-4 max-w-md mx-auto">
                        ${optionsHTML}
                    </div>
                    <p id="feedback" class="mt-4 text-lg sm:text-xl font-bold h-8 text-red-500"></p>
                </div>

                <!-- Cards Grid Section -->
                <div id="card-section" class="${cardSectionClass}">
                    <div class="grid grid-cols-4 gap-3 sm:gap-4 max-w-xl mx-auto mb-2">
                        ${cardsHTML}
                    </div>
                    <div id="card-feedback-box" class="min-h-[4rem] flex items-center justify-center">
                        ${feedbackBoxHTML}
                    </div>
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
