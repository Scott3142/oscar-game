<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oscar's Games! 🎮</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(135deg, #fbcfe8 0%, #bae6fd 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">
    <div class="max-w-xl w-full bg-white/95 backdrop-blur rounded-3xl shadow-2xl p-8 text-center border-4 border-yellow-300">
        
        <!-- Language Selector Top Bar -->
        <div class="flex justify-end gap-2 mb-4">
            <button onclick="setLang('en')" id="btn-en" class="px-3 py-1 rounded-xl font-bold text-sm bg-purple-600 text-white shadow">English</button>
            <button onclick="setLang('cy')" id="btn-cy" class="px-3 py-1 rounded-xl font-bold text-sm bg-gray-200 text-gray-700 hover:bg-gray-300">Cymraeg</button>
        </div>

        <h1 id="hub-title" class="text-4xl sm:text-5xl font-extrabold text-purple-600 mb-2">🌟 Oscar's Games! 🌟</h1>
        <p id="hub-subtitle" class="text-gray-600 mb-8 text-lg">Pick a game to play today!</p>

        <!-- Game Selection Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-md mx-auto">
            
            <!-- Reading Game Card -->
            <a href="reading/" class="group bg-gradient-to-br from-pink-400 to-purple-500 hover:from-pink-500 hover:to-purple-600 text-white rounded-3xl p-6 shadow-xl hover:scale-105 transition transform flex flex-col items-center justify-center border-4 border-white">
                <span class="text-6xl mb-3">📖</span>
                <span id="card-reading-title" class="text-2xl font-bold">Reading</span>
                <span id="card-reading-sub" class="text-sm text-pink-100 mt-1">Find Oscar & Family!</span>
            </a>

            <!-- Numberblocks Game Card -->
            <a href="numberblocks/docs/" class="group bg-gradient-to-br from-blue-400 to-indigo-500 hover:from-blue-500 hover:to-indigo-600 text-white rounded-3xl p-6 shadow-xl hover:scale-105 transition transform flex flex-col items-center justify-center border-4 border-white">
                <span class="text-6xl mb-3">🔢</span>
                <span id="card-num-title" class="text-2xl font-bold">Numberblocks</span>
                <span id="card-num-sub" class="text-sm text-blue-100 mt-1">Let's count & play!</span>
            </a>

        </div>
    </div>

    <script>
        function setLang(lang) {
            localStorage.setItem('oscar_game_lang', lang);
            updateHubText(lang);
        }

        function updateHubText(lang) {
            const btnEn = document.getElementById('btn-en');
            const btnCy = document.getElementById('btn-cy');

            if (lang === 'cy') {
                btnCy.className = "px-3 py-1 rounded-xl font-bold text-sm bg-purple-600 text-white shadow";
                btnEn.className = "px-3 py-1 rounded-xl font-bold text-sm bg-gray-200 text-gray-700 hover:bg-gray-300";
                document.getElementById('hub-title').innerText = "🌟 Gemau Oscar! 🌟";
                document.getElementById('hub-subtitle').innerText = "Dewiswch gêm i'ch chwarae heddiw!";
                document.getElementById('card-reading-title').innerText = "Darllen";
                document.getElementById('card-reading-sub').innerText = "Dewch o hyd i Oscar a'r Teulu!";
                document.getElementById('card-num-title').innerText = "Numberblocks";
                document.getElementById('card-num-sub').innerText = "Gadewch i ni gyfrif!";
            } else {
                btnEn.className = "px-3 py-1 rounded-xl font-bold text-sm bg-purple-600 text-white shadow";
                btnCy.className = "px-3 py-1 rounded-xl font-bold text-sm bg-gray-200 text-gray-700 hover:bg-gray-300";
                document.getElementById('hub-title').innerText = "🌟 Oscar's Games! 🌟";
                document.getElementById('hub-subtitle').innerText = "Pick a game to play today!";
                document.getElementById('card-reading-title').innerText = "Reading";
                document.getElementById('card-reading-sub').innerText = "Find Oscar & Family!";
                document.getElementById('card-num-title').innerText = "Numberblocks";
                document.getElementById('card-num-sub').innerText = "Let's count & play!";
            }
        }

        // Load saved language preference on start
        const savedLang = localStorage.getItem('oscar_game_lang') || 'en';
        updateHubText(savedLang);
    </script>
</body>
</html>
